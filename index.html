<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1117" />
    <link rel="icon" href="data:," />
    <title>Sandwich of Rage</title>
  </head>
  <body>
    <main id="shell">
      <canvas id="game" aria-label="Sandwich of Rage game canvas"></canvas>

      <div id="hud">
        <header class="brand">
          <h1>SANDWICH OF RAGE</h1>
          <p>a sandwich speedrun</p>
        </header>

        <div id="level-label" class="level-label"></div>

        <div id="ingredient" class="ingredient">? Bread</div>

        <div class="timer-box">
          <div class="timer-label">SPEEDRUN</div>
          <div id="timer" class="timer">0:00.000</div>
          <div id="best-time" class="best-time">BEST —</div>
        </div>

        <aside class="controls" aria-label="Controls">
          <div><kbd>A</kbd><kbd>D</kbd> move <kbd>SPACE</kbd> jump <kbd>SHIFT</kbd> dash</div>
          <div>stomp mushrooms <kbd>N</kbd> next <kbd>R</kbd> respawn <kbd>M</kbd> mute <kbd>F1</kbd> debug</div>
        </aside>

        <div id="toast" class="toast" role="status"></div>

        <aside id="debug" class="debug" hidden>
          <div class="debug-title">DEBUG <span>F1</span></div>
          <pre id="debug-body"></pre>
        </aside>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
